<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nepali Date Helper</title>
	<style></style>
</head>
<body>
	<div class="container">
		<div class="meromiti-widget" 
			data-type="month" 
			data-bg="glass" 
			data-border="0" 
			data-branding="0"></div>
		<script src="https://meromiti.com/widget.js" async></script>
	</div>

<script>
	const iframe = window.frameElement;
	window.addEventListener('load', function() {
		iframe.style.height = "350px";
		iframe.parentElement.style.height = "350px";
		iframe.style.border = "1px solid #d4d4d4";
		iframe.style.borderRadius = "5px";
		iframe.style.background = "#fff";

		// Style inside the widget iframe
		const meroMitiIframe = document.querySelector('iframe');
		meroMitiIframe.onload = function () {
					var doc = iframe.contentDocument || iframe.contentWindow.document;
					var style = doc.createElement('style');
					style.textContent = `
							.meromiti-month-widget {
									padding:0 !important;
							}
					`;
					doc.head.appendChild(style);
			};		
	});

	window.addEventListener('DOMContentLoaded', () => {
			// 1. Locate the iframe element inside the parent window
			const iframe = window.parent.document.querySelector('iframe[src*="Nepali-Calendar-Helper"]');

			if (iframe) {
					// 2. Access its parent element (the <div>)
					const parentDiv = iframe.parentElement;

					// 3. Apply your styles
					/*parentDiv.style.height = "500px";
					parentDiv.style.border = "2px solid red";
					parentDiv.style.display = "flex";*/

					parentDiv.style.position = "fixed";
					parentDiv.style.bottom = "20px";
					parentDiv.style.right = "20px";
					parentDiv.style.zIndex = "9999";
	
					parentDiv.style.height = "350px"; 
					iframe.style.height = "100%";
					iframe.style.width = "100%";
			}
	});
	
</script>
</body>
</html>
